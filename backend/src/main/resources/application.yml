server:
  port: 8080

spring:
  application:
    name: material-studio-backend
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/material_studio?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      maximum-pool-size: 8
      # 起步阶段 MySQL 可能尚未就绪（compose 健康检查之外的一层保护），等待而不是立刻失败
      initialization-fail-timeout: 30000
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 120MB
  # 建表与种子脚本与 db/init/ 完全同源（compose 中挂载给 MySQL 初始化），幂等可重复执行
  sql:
    init:
      mode: always
      schema-locations: classpath:db/init/01-schema.sql
      data-locations: classpath:db/init/02-seed.sql
  jackson:
    default-property-inclusion: always

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true

app:
  # 上传素材与生成结果存放目录（compose 中挂载为数据卷）
  data-dir: ${DATA_DIR:./data}
  session:
    cookie-name: MS_SESSION
    max-age-seconds: 15552000 # 180 天
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

sim:
  material-check-ms: ${SIM_MATERIAL_CHECK_MS:2000}
  simulate-generate-ms: ${SIM_SIMULATE_GENERATE_MS:4000}
  result-finalize-ms: ${SIM_RESULT_FINALIZE_MS:2500}
  # 启动默认的注入失败阶段：空=不失败；可选 MATERIAL_CHECK / SIMULATE_GENERATE / RESULT_FINALIZE
  fail-stage: ${SIM_FAIL_STAGE:}
  dev-api-enabled: true

task:
  execution:
    # async：单线程队列异步执行（默认）；sync：提交时同线程顺序执行，供自动化测试/CI 使用
    mode: ${TASK_EXECUTION_MODE:async}
