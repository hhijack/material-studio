services:
  mysql:
    image: mysql:8.4
    container_name: ms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: material_studio
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 建表与种子脚本（首次启动自动执行；后端启动时也会执行同一份脚本，双保险）
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s
    ports:
      - "3306:3306"

  backend:
    build:
      context: ./backend
    container_name: ms-backend
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/material_studio?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root
      DATA_DIR: /app/data
      SIM_MATERIAL_CHECK_MS: 2000
      SIM_SIMULATE_GENERATE_MS: 4000
      SIM_RESULT_FINALIZE_MS: 2500
      TASK_EXECUTION_MODE: async
    volumes:
      - app-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        # Next.js standalone 的 rewrites 目标在构建期烘焙（routes-manifest.json），
        # 运行期环境变量不生效，后端地址必须通过构建参数注入
        BACKEND_ORIGIN: http://backend:8080
    container_name: ms-frontend
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  mysql-data:
  app-data:
